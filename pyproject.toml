[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-distributed-trace-stitcher"
version = "0.1.0"
description = "Correlates W3C traceparent headers across asynchronous A2A agent boundaries to reconstruct end-to-end timelines"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
a2a-distributed-trace-stitcher = "a2a_distributed_trace_stitcher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["a2a_distributed_trace_stitcher*"]
